name: SetGoals
options:
  bundleIdPrefix: app.setgoals
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  SetGoals:
    type: application
    platform: iOS
    sources:
      - path: SetGoals
    info:
      path: SetGoals/Info.plist
      properties:
        CFBundleDisplayName: SetGoals
        CFBundleURLTypes:
          - CFBundleURLName: app.setgoals.auth
            CFBundleURLSchemes:
              - app.setgoals
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: SetGoals reads your steps, distance and active energy to calculate your daily goal progress and earned screen time.
        NSHealthUpdateUsageDescription: SetGoals does not write health data, but the permission sheet requires this entry.
        NSLocationWhenInUseUsageDescription: Your region is used to place you on the local and national leaderboards.
        NSPhotoLibraryUsageDescription: Pick a profile picture for yourself or your child.
        NSCameraUsageDescription: Take a photo as proof when completing a task.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: SetGoals/SetGoals.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.family-controls: true
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.app.setgoals.shared
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
